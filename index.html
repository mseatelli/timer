<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronomulti-Cuisson Pro</title>
    <style>
        /* (Garder le CSS existant et ajouter/modifier ceci) */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #ff6b35; }

        .tabs { display: flex; margin-bottom: 20px; background: #2d2d2d; border-radius: 10px; padding: 5px; gap: 5px; }
        .tab { flex: 1; padding: 12px; background: transparent; border: none; color: white; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tab.active { background: #ff6b35; font-weight: bold; }

        .tab-content { display: none; background: #2d2d2d; padding: 20px; border-radius: 10px; }
        .tab-content.active { display: block; }

        /* FAVORIS & GRILLE */
        .favorites-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; }
        .favorite-btn { background: #3d3d3d; padding: 15px; border-radius: 12px; cursor: pointer; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; position: relative; }
        .favorite-btn:hover { border-color: #ff6b35; background: #454545; }
        .delete-fav { position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.3); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: white; cursor: pointer; border: none; }

        /* TIMERS */
        .timer-card { background: #3d3d3d; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #ff6b35; transition: 0.3s; }
        .timer-time { font-size: 2.5em; font-weight: bold; text-align: center; font-family: monospace; color: #ff6b35; }
        .progress-bar { width: 100%; height: 8px; background: #555; border-radius: 4px; margin: 10px 0; overflow: hidden; }
        .progress-fill { height: 100%; background: #44ff44; width: 0%; transition: width 1s linear, background-color 0.5s; }
        
        .timer-controls { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 10px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-add-fav { background: #4a90e2; color: white; margin-top: 10px; width: 100%; }
        .btn-stop { background: #ff4444; color: white; }
        
        @keyframes urgent { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .urgent { animation: urgent 0.5s infinite; border-color: #ff4444 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍳 Chronomulti-Cuisson Pro</h1>
            <p>Le chef, c'est vous. Le temps, c'est nous.</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('timers', this)">⏱️ Actifs</button>
            <button class="tab" onclick="showTab('favorites', this)">⭐ Favoris</button>
            <button class="tab" onclick="showTab('new-timer', this)">➕ Nouveau</button>
            <button class="tab" onclick="showTab('weight-calc', this)">🥩 Viandes</button>
        </div>

        <div id="timers" class="tab-content active">
            <div id="active-timers"><div class="no-timers" style="text-align: center; color:#888;">Aucune cuisson en cours</div></div>
        </div>

        <div id="favorites" class="tab-content">
            <h3>Mes Recettes</h3>
            <div id="custom-favs" class="favorites-grid"></div>
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #444;">
            <h3>Classiques</h3>
            <div id="default-favs" class="favorites-grid"></div>
        </div>

        <div id="new-timer" class="tab-content">
            <div style="margin-bottom:15px">
                <label>Nom :</label>
                <input type="text" id="timer-name" style="width:100%; padding:10px; background:#3d3d3d; color:white; border:none; border-radius:5px;" placeholder="Ex: Lasagnes">
            </div>
            <div style="display:flex; gap:10px; margin-bottom:20px">
                <input type="number" id="mins" value="10" min="0" style="width:100%; padding:10px; background:#3d3d3d; color:white; border:none;">
                <span style="align-self:center">min</span>
            </div>
            <button onclick="handleCreateTimer(false)" style="background:#ff6b35; color:white; width:100%; margin-bottom:10px">🚀 Démarrer</button>
            <button onclick="handleCreateTimer(true)" class="btn-add-fav">⭐ Enregistrer en favori</button>
        </div>

        <div id="weight-calc" class="tab-content">
             <p style="color:#888; text-align:center">Utilisez l'onglet Nouveau pour les réglages précis.</p>
        </div>
    </div>

    <script>
        let activeTimers = [];
        const defaultRecipes = [
            { name: "Œuf à la coque", time: 180, icon: "🥚" },
            { name: "Pâtes Al Dente", time: 540, icon: "🍝" },
            { name: "Riz Basmati", time: 660, icon: "🍚" },
            { name: "Pommes de terre", time: 1200, icon: "🥔" }
        ];

        // --- GESTION DES FAVORIS (LocalStorage) ---
        function getCustomFavs() {
            return JSON.parse(localStorage.getItem('cooking_favs')) || [];
        }

        function saveFav(name, seconds) {
            const favs = getCustomFavs();
            favs.push({ name, time: seconds, icon: "🍳" });
            localStorage.setItem('cooking_favs', JSON.stringify(favs));
            renderFavorites();
        }

        function deleteFav(index) {
            const favs = getCustomFavs();
            favs.splice(index, 1);
            localStorage.setItem('cooking_favs', JSON.stringify(favs));
            renderFavorites();
        }

        function renderFavorites() {
            const customDiv = document.getElementById('custom-favs');
            const defaultDiv = document.getElementById('default-favs');
            
            customDiv.innerHTML = getCustomFavs().map((f, i) => `
                <div class="favorite-btn" onclick="addTimer('${f.name}', ${f.time})">
                    <button class="delete-fav" onclick="event.stopPropagation(); deleteFav(${i})">✕</button>
                    <span style="font-size:2em">${f.icon}</span>
                    <span style="font-weight:bold; text-align:center">${f.name}</span>
                    <small style="color:#ff6b35">${Math.floor(f.time/60)} min</small>
                </div>
            `).join('');

            defaultDiv.innerHTML = defaultRecipes.map(f => `
                <div class="favorite-btn" onclick="addTimer('${f.name}', ${f.time})">
                    <span style="font-size:2em">${f.icon}</span>
                    <span style="font-weight:bold">${f.name}</span>
                    <small style="color:#ff6b35">${f.time/60} min</small>
                </div>
            `).join('');
        }

        // --- ALARME PUISSANTE (AudioContext) ---
        function playEmergencyAlarm(timer) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            let oscillator1, oscillator2;
            
            timer.alarmActive = true;

            const startLoop = () => {
                if (!timer.alarmActive) return;
                
                // Son bitonal type sirène (Plus fort que le précédent)
                oscillator1 = ctx.createOscillator();
                const gain = ctx.createGain();
                
                oscillator1.type = 'square'; // Son plus percutant
                oscillator1.frequency.setValueAtTime(880, ctx.currentTime);
                oscillator1.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.5);
                
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                
                oscillator1.connect(gain);
                gain.connect(ctx.destination);
                
                oscillator1.start();
                oscillator1.stop(ctx.currentTime + 0.5);
                
                timer.audioTimeout = setTimeout(startLoop, 600);
            };
            
            startLoop();
            timer.audioCtx = ctx; // Stocker pour arrêter
        }

        // --- MOTEUR DES TIMERS ---
        function addTimer(name, seconds) {
            const timer = {
                id: Date.now(),
                name: name || "Cuisson",
                total: seconds,
                remaining: seconds,
                status: 'running'
            };
            activeTimers.push(timer);
            showTab('timers', document.querySelectorAll('.tab')[0]);
            updateDisplay();
        }

        setInterval(() => {
            activeTimers.forEach(t => {
                if (t.status === 'running' && t.remaining > 0) {
                    t.remaining--;
                    if (t.remaining === 0) {
                        t.status = 'finished';
                        playEmergencyAlarm(t);
                        sendNotification(t.name);
                    }
                }
            });
            updateDisplay();
        }, 1000);

        function updateDisplay() {
            const container = document.getElementById('active-timers');
            if (activeTimers.length === 0) {
                container.innerHTML = '<div class="no-timers">Aucune cuisson...</div>';
                return;
            }

            container.innerHTML = activeTimers.map(t => {
                const progress = ((t.total - t.remaining) / t.total) * 100;
                const isUrgent = t.remaining < 30 && t.remaining > 0;
                let color = "#44ff44";
                if (progress > 70) color = "#ff6b35";
                if (isUrgent || t.status === 'finished') color = "#ff4444";

                return `
                    <div class="timer-card ${t.status === 'finished' ? 'urgent' : ''}" style="border-color: ${color}">
                        <div style="display:flex; justify-content:space-between">
                            <strong>${t.status === 'finished' ? '🔔 TERMINÉ !' : '🔥 ' + t.name}</strong>
                            <span>${t.status === 'finished' ? '00:00' : formatTime(t.remaining)}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width:${progress}%; background:${color}"></div>
                        </div>
                        <div class="timer-controls">
                            <button class="btn-stop" onclick="stopTimer(${t.id})">
                                ${t.status === 'finished' ? '🔕 ARRÊTER L\'ALARME' : '⏹️ Annuler'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function stopTimer(id) {
            const t = activeTimers.find(x => x.id === id);
            if (t) {
                t.alarmActive = false;
                clearTimeout(t.audioTimeout);
                activeTimers = activeTimers.filter(x => x.id !== id);
            }
            updateDisplay();
        }

        // --- UTILS ---
        function showTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function handleCreateTimer(isFav) {
            const name = document.getElementById('timer-name').value;
            const secs = parseInt(document.getElementById('mins').value) * 60;
            if (isFav) saveFav(name, secs);
            else addTimer(name, secs);
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        }

        function sendNotification(name) {
            if (Notification.permission === "granted") new Notification("C'est prêt !", { body: name });
        }

        // Init
        renderFavorites();
        if (Notification.permission === "default") Notification.requestPermission();
    </script>
</body>
</html>
