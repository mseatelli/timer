<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono-Cuisson Pro v2</title>
    <style>
        :root { --primary: #ff6b35; --bg: #1a1a1a; --card: #2d2d2d; --text: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; color: var(--primary); }

        /* ONGLETS */
        .tabs { display: flex; gap: 5px; background: var(--card); border-radius: 10px; padding: 5px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px 5px; border: none; background: none; color: white; cursor: pointer; border-radius: 8px; font-size: 0.85em; }
        .tab.active { background: var(--primary); font-weight: bold; }

        .tab-content { display: none; background: var(--card); padding: 20px; border-radius: 15px; min-height: 400px; }
        .tab-content.active { display: block; }

        /* FAVORIS */
        .category-section { margin-bottom: 20px; border: 1px solid #444; padding: 15px; border-radius: 12px; }
        .category-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); margin-bottom: 15px; }
        .favorites-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
        .favorite-btn { background: #3d3d3d; padding: 15px; border-radius: 10px; border: none; color: white; position: relative; cursor: pointer; text-align: center; }
        .fav-delete { position: absolute; top: -5px; right: -5px; background: #ff4444; border: none; color: white; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; }

        /* FORMULAIRES */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #ccc; font-size: 0.9em; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #3d3d3d; color: white; font-size: 16px; }
        .main-btn { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* CUISSON AU POIDS */
        .weight-card { background: #3d3d3d; padding: 20px; border-radius: 15px; text-align: center; }
        .weight-icon { font-size: 3em; margin-bottom: 10px; }
        .temp-badge { display: inline-block; background: #44ff44; color: #000; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.85em; margin: 10px 0; }

        /* TIMERS */
        .timer-card { background: #3d3d3d; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); }
        .timer-time { font-size: 2.2em; font-family: monospace; text-align: center; color: var(--primary); margin: 5px 0; }
        .backup-btns { display: flex; gap: 10px; margin-top: 20px; }
        .btn-small { flex: 1; background: #555; border: none; color: white; padding: 10px; border-radius: 8px; font-size: 0.8em; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>🍳 Chrono-Cuisson Chef</h1></div>

    <div class="tabs">
        <button class="tab active" onclick="showTab('timers')">⏱️ Cuissons</button>
        <button class="tab" onclick="showTab('favorites')">⭐ Mes Recettes</button>
        <button class="tab" onclick="showTab('weight-calc')">🥩 Au Poids</button>
    </div>

    <div id="timers" class="tab-content active">
        <div id="active-timers-list"><p style="text-align:center; color:#888; margin-top:50px;">Aucune cuisson en cours</p></div>
    </div>

    <div id="favorites" class="tab-content">
        <button onclick="addCategory()" class="main-btn" style="background:#444; margin-bottom:20px;">📁 Nouvelle Catégorie</button>
        <div id="favorites-container"></div>
        <div class="backup-btns">
            <button class="btn-small" onclick="exportData()">📤 Exporter</button>
            <button class="btn-small" onclick="document.getElementById('importFile').click()">📥 Importer</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(this)">
        </div>
    </div>

    <div id="weight-calc" class="tab-content">
        <div class="weight-card">
            <div id="meat-icon" class="weight-icon">🥩</div>
            <div class="form-group">
                <select id="meat-select" onchange="updateWeightUI()">
                    <option value="beef">Rôti de Bœuf</option>
                    <option value="veal">Rôti de Veau</option>
                    <option value="lamb">Gigot d'Agneau</option>
                    <option value="pork">Rôti de Porc</option>
                    <option value="chicken">Poulet Entier</option>
                </select>
            </div>
            <div class="form-group">
                <label>Poids (kg)</label>
                <input type="number" id="w-input" value="1.0" step="0.1" oninput="updateWeightUI()">
            </div>
            <div id="cook-div" class="form-group">
                <label>Cuisson souhaitée</label>
                <select id="cook-select" onchange="updateWeightUI()">
                    <option value="rare">Saignant / Rosé</option>
                    <option value="medium">À point</option>
                    <option value="well">Bien cuit</option>
                </select>
            </div>
            <div id="temp-display" class="temp-badge">Cœur : --</div>
            <div id="w-result" style="font-size:2.5em; font-weight:bold; color:var(--primary); margin:10px 0;">--</div>
            <button class="main-btn" onclick="startWeightTimer()">Démarrer la cuisson</button>
        </div>
    </div>
</div>

<script>
    // --- DONNÉES ET PERSISTANCE ---
    const STORAGE_KEY = 'chronoChef_data';
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
        categories: [{ id: 1, name: "🥚 Œufs", items: [{name: "Coque", time: 180}] }]
    };

    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); }

    // --- RÈGLES DE CUISSON (Basées sur vos données) ---
    const rules = {
        beef: { icon: '🥩', rare: {m: 26, t: '55°C'}, medium: {m: 35, t: '60°C'}, well: {m: 45, t: '70°C'} },
        veal: { icon: '🐄', rare: {m: 50, t: '60°C'}, medium: {m: 60, t: '68°C'}, well: {m: 75, t: '75°C'} },
        lamb: { icon: '🐑', rare: {m: 30, t: '60°C'}, medium: {m: 40, t: '65°C'}, well: {m: 50, t: '70°C'} },
        pork: { icon: '🍖', fixed: 90, t: '85°C' }, // 1h30 fixe pour 1kg
        chicken: { icon: '🍗', fixed: 40, t: '85°C' } // 40 min fixe
    };

    function updateWeightUI() {
        const meat = document.getElementById('meat-select').value;
        const weight = parseFloat(document.getElementById('w-input').value) || 1;
        const cook = document.getElementById('cook-select').value;
        const rule = rules[meat];
        
        document.getElementById('meat-icon').textContent = rule.icon;
        document.getElementById('cook-div').style.display = rule.fixed ? 'none' : 'block';

        let minutes, temp;
        if(rule.fixed) {
            minutes = rule.fixed * weight;
            temp = rule.t;
        } else {
            minutes = rule[cook].m * weight;
            temp = rule[cook].t;
        }

        document.getElementById('w-result').textContent = Math.round(minutes) + " min";
        document.getElementById('temp-display').textContent = "Température cœur : " + temp;
    }

    // --- NAVIGATION ET TIMERS ---
    let timers = [];

    function showTab(id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.currentTarget.classList.add('active');
        if(id === 'favorites') renderFavorites();
    }

    function launchTimer(name, sec) {
        timers.push({ id: Date.now(), name, rem: sec, total: sec });
        showTab('timers');
        document.querySelectorAll('.tab')[0].classList.add('active');
    }

    setInterval(() => {
        timers.forEach(t => {
            if(t.rem > 0) {
                t.rem--;
                if(t.rem === 0) alert("🔔 " + t.name + " est prêt !");
            }
        });
        renderTimers();
    }, 1000);

    function renderTimers() {
        const div = document.getElementById('active-timers-list');
        if(timers.length === 0) {
            div.innerHTML = "<p style='text-align:center; color:#888; margin-top:50px;'>Aucune cuisson</p>";
            return;
        }
        div.innerHTML = timers.map(t => `
            <div class="timer-card">
                <div style="font-weight:bold">${t.name}</div>
                <div class="timer-time">${new Date(t.rem * 1000).toISOString().substr(11, 8)}</div>
                <button onclick="timers = timers.filter(x=>x.id!==${t.id})" class="main-btn" style="padding:5px; background:#ff4444">Arrêter</button>
            </div>
        `).join('');
    }

    function startWeightTimer() {
        const label = document.getElementById('meat-select').options[document.getElementById('meat-select').selectedIndex].text;
        const mins = parseInt(document.getElementById('w-result').textContent);
        launchTimer(label, mins * 60);
    }

    // --- GESTION FAVORIS ---
    function renderFavorites() {
        const cont = document.getElementById('favorites-container');
        cont.innerHTML = appData.categories.map(cat => `
            <div class="category-section">
                <div class="category-header">
                    <h3>${cat.name}</h3>
                    <button onclick="delCat(${cat.id})" style="background:none; border:none; color:#ff4444; cursor:pointer">Suppr.</button>
                </div>
                <div class="favorites-grid">
                    ${cat.items.map((it, idx) => `
                        <div class="favorite-btn" onclick="launchTimer('${it.name}', ${it.time})">
                            ${it.name}<br><small>${Math.floor(it.time/60)}m</small>
                            <button class="fav-delete" onclick="event.stopPropagation(); delItem(${cat.id}, ${idx})">×</button>
                        </div>
                    `).join('')}
                    <button onclick="addItem(${cat.id})" class="favorite-btn" style="background:#222; border:1px dashed #555">+</button>
                </div>
            </div>
        `).join('');
    }

    function addCategory() {
        const n = prompt("Nom du dossier ?");
        if(n) { appData.categories.push({id:Date.now(), name:n, items:[]}); save(); renderFavorites(); }
    }

    function delCat(id) { if(confirm("Supprimer ?")) { appData.categories = appData.categories.filter(c=>c.id!==id); save(); renderFavorites(); } }

    function addItem(catId) {
        const n = prompt("Nom de la recette ?");
        const m = prompt("Durée en minutes ?");
        if(n && m) {
            appData.categories.find(c=>c.id===catId).items.push({name:n, time: m*60});
            save(); renderFavorites();
        }
    }

    function delItem(catId, idx) {
        appData.categories.find(c=>c.id===catId).items.splice(idx, 1);
        save(); renderFavorites();
    }

    // --- IMPORT / EXPORT ---
    function exportData() {
        const blob = new Blob([JSON.stringify(appData)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'ma_cuisine.json'; a.click();
    }

    function importData(input) {
        const reader = new FileReader();
        reader.onload = e => {
            appData = JSON.parse(e.target.result);
            save(); renderFavorites();
            alert("Favoris restaurés !");
        };
        reader.readAsText(input.files[0]);
    }

    updateWeightUI();
</script>
</body>
</html>
