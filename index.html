<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronomulti-Cuisson</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #1a1a1a; 
            color: white;
            padding: 20px;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #ff6b35;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #ccc;
            font-size: 1.1em;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            background: #2d2d2d;
            border-radius: 10px;
            padding: 5px;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            background: transparent;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        
        .tab.active {
            background: #ff6b35;
            font-weight: bold;
        }
        
        .tab-content {
            display: none;
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
            font-weight: 500;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3d3d3d;
            color: white;
            font-size: 16px;
        }
        
        input:focus, select:focus {
            outline: 2px solid #ff6b35;
        }
        
        .time-inputs {
            display: flex;
            gap: 10px;
        }
        
        .time-inputs input {
            text-align: center;
        }
        
        button {
            background: #ff6b35;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
            font-weight: 500;
        }
        
        button:hover {
            background: #e55a2b;
            transform: translateY(-2px);
        }
        
        .timer-card {
            background: #3d3d3d;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #ff6b35;
        }
        
        .timer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .timer-name {
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .timer-time {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            color: #ff6b35;
        }
        
        .timer-controls {
            display: flex;
            gap: 10px;
        }
        
        .btn-pause { background: #ffa500; }
        .btn-stop { background: #ff4444; }
        .btn-resume { background: #44ff44; color: black; }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #555;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #ff6b35;
            transition: width 1s linear;
        }
        
        .weight-result {
            background: #4d4d4d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-size: 1.2em;
        }
        
        .hidden {
            display: none;
        }
        
        .no-timers {
            text-align: center;
            color: #888;
            padding: 40px;
            font-style: italic;
        }
        
        /* FAVORIS */
        .fav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .btn-green {
            background: #44ff44;
            color: black;
        }
        
        .category-section {
            margin-top: 30px;
            border: 2px solid #3d3d3d;
            padding: 20px;
            border-radius: 10px;
        }
        
        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff6b35;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        
        .category-title {
            color: #ff6b35;
            font-size: 1.5em;
        }
        
        .category-buttons {
            display: flex;
            gap: 10px;
        }
        
        .fav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .fav-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .fav-card {
            background: #3d3d3d;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .fav-card:hover {
            border-color: #ff6b35;
            transform: scale(1.05);
        }
        
        .fav-icon {
            font-size: 2.5em;
        }
        
        .fav-name {
            font-weight: 600;
            font-size: 0.95em;
            text-align: center;
        }
        
        .fav-time {
            color: #ff6b35;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .fav-actions {
            display: flex;
            gap: 5px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
            flex: 1;
        }
        
        .btn-orange {
            background: #ffa500;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 600px) {
            .time-inputs {
                flex-direction: column;
            }
            
            .timer-controls {
                flex-direction: column;
            }
            
            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍳 Chronomulti-Cuisson</h1>
            <p>Gérez plusieurs cuissons simultanément</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="window.switchTab('timers')">⏱️ Minuteries</button>
            <button class="tab" onclick="window.switchTab('favorites')">⭐ Favoris</button>
            <button class="tab" onclick="window.switchTab('new-timer')">➕ Nouvelle Minuterie</button>
            <button class="tab" onclick="window.switchTab('weight-calc')">🥩 Cuisson au Poids</button>
        </div>
        
        <div id="timers" class="tab-content active">
            <h2>⏱️ Minuteries Actives</h2>
            <div id="active-timers">
                <div class="no-timers">Aucune minuterie active</div>
            </div>
        </div>
        
        <div id="favorites" class="tab-content">
            <div class="fav-header">
                <h2>⭐ Recettes Favorites</h2>
                <button class="btn-green" onclick="window.addNewCategory()">➕ Nouvelle Catégorie</button>
            </div>
            <div id="favorites-list"></div>
        </div>
        
        <div id="new-timer" class="tab-content">
            <h2>➕ Nouvelle Minuterie</h2>
            <div class="form-group">
                <label for="timer-name">Nom de la minuterie :</label>
                <input type="text" id="timer-name" placeholder="Ex: Riz basmati, Sauce tomate...">
            </div>
            
            <div class="form-group">
                <label>Durée :</label>
                <div class="time-inputs">
                    <input type="number" id="hours" placeholder="Heures" min="0" value="0">
                    <input type="number" id="minutes" placeholder="Minutes" min="0" value="10">
                    <input type="number" id="seconds" placeholder="Secondes" min="0" value="0">
                </div>
            </div>
            
            <button onclick="window.createTimer()">🚀 Démarrer la minuterie</button>
        </div>
        
        <div id="weight-calc" class="tab-content">
            <h2>🥩 Calculateur de Cuisson</h2>
            
            <div class="form-group">
                <label for="meat-type">Type de viande :</label>
                <select id="meat-type" onchange="window.calculateWeightTime()">
                    <option value="beef">Bœuf</option>
                    <option value="lamb">Agneau</option>
                    <option value="pork">Porc</option>
                    <option value="chicken">Poulet</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="meat-cut">Morceau :</label>
                <select id="meat-cut" onchange="window.calculateWeightTime()">
                    <option value="roast">Rôti</option>
                    <option value="fillet">Filet</option>
                    <option value="leg">Gigot</option>
                    <option value="shoulder">Épaule</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="weight">Poids (kg) :</label>
                <input type="number" id="weight" step="0.1" min="0.1" value="1.5" oninput="window.calculateWeightTime()">
            </div>
            
            <div class="form-group">
                <label for="cooking-level">Cuisson désirée :</label>
                <select id="cooking-level" onchange="window.calculateWeightTime()">
                    <option value="blue">Bleu</option>
                    <option value="rare">Saignant</option>
                    <option value="medium">À point</option>
                    <option value="well-done">Bien cuit</option>
                </select>
            </div>
            
            <div id="weight-result" class="weight-result hidden">
                <div>⏱️ Temps de cuisson estimé :</div>
                <div id="calculated-time" style="font-size: 1.5em; font-weight: bold; margin: 10px 0;"></div>
                <button onclick="window.createTimerFromWeight()">📌 Créer la minuterie</button>
            </div>
        </div>
    </div>

    <script>
        // === DÉFINIR TOUTES LES FONCTIONS GLOBALES IMMÉDIATEMENT ===
        
        // Gestion onglets
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            
            const tabs = ['timers', 'favorites', 'new-timer', 'weight-calc'];
            const index = tabs.indexOf(tabName);
            if (index >= 0) {
                document.querySelectorAll('.tab')[index].classList.add('active');
            }
            
            if (tabName === 'favorites') {
                window.renderFavorites();
            }
        };
        
        // === VARIABLES GLOBALES ===
        const cookingTimes = {
            beef: { blue: 30, rare: 40, medium: 50, "well-done": 60 },
            lamb: { rare: 45, medium: 55, "well-done": 65 },
            pork: { medium: 55, "well-done": 70 },
            chicken: { "well-done": 45 }
        };
        
        let activeTimers = [];
        let nextId = 16;
        
        const defaultFavorites = [
            { id: 1, category: 'Cuisson des Œufs', icon: '🥚', name: 'Œuf à la coque', seconds: 180 },
            { id: 2, category: 'Cuisson des Œufs', icon: '🥚', name: 'Œuf mollet', seconds: 360 },
            { id: 3, category: 'Cuisson des Œufs', icon: '🥚', name: 'Œuf dur', seconds: 540 },
            { id: 4, category: 'Cuisson des Œufs', icon: '🥚', name: 'Œuf poché', seconds: 180 },
            { id: 5, category: 'Cuisson des Œufs', icon: '🍳', name: 'Œuf au plat', seconds: 240 },
            { id: 6, category: 'Pâtes & Riz', icon: '🍝', name: 'Pâtes al dente', seconds: 600 },
            { id: 7, category: 'Pâtes & Riz', icon: '🍚', name: 'Riz basmati', seconds: 720 },
            { id: 8, category: 'Pâtes & Riz', icon: '🍚', name: 'Riz complet', seconds: 1500 },
            { id: 9, category: 'Légumes', icon: '🥔', name: 'Pommes de terre vapeur', seconds: 1200 },
            { id: 10, category: 'Légumes', icon: '🥦', name: 'Brocolis vapeur', seconds: 300 },
            { id: 11, category: 'Légumes', icon: '🥕', name: 'Carottes vapeur', seconds: 480 },
            { id: 12, category: 'Steaks à la Poêle', icon: '🥩', name: 'Steak bleu', seconds: 60 },
            { id: 13, category: 'Steaks à la Poêle', icon: '🥩', name: 'Steak saignant', seconds: 120 },
            { id: 14, category: 'Steaks à la Poêle', icon: '🥩', name: 'Steak à point', seconds: 180 },
            { id: 15, category: 'Steaks à la Poêle', icon: '🥩', name: 'Steak bien cuit', seconds: 210 }
        ];
        
        let favorites = [...defaultFavorites];
        
        // === FAVORIS ===
        window.renderFavorites = function() {
            const container = document.getElementById('favorites-list');
            const categories = [...new Set(favorites.map(f => f.category))];
            
            let html = '';
            
            categories.forEach(cat => {
                const catFavs = favorites.filter(f => f.category === cat);
                const icon = catFavs[0].icon;
                
                html += '<div class="category-section">';
                html += '<div class="category-header">';
                html += '<h3 class="category-title">' + icon + ' ' + cat + '</h3>';
                html += '<div class="category-buttons">';
                html += '<button class="btn-green btn-small" onclick="addFavToCategory(\'' + cat.replace(/'/g, "\\'") + '\')">➕ Ajouter</button>';
                html += '<button class="btn-stop btn-small" onclick="deleteCategory(\'' + cat.replace(/'/g, "\\'") + '\')">🗑️</button>';
                html += '</div></div>';
                
                html += '<div class="fav-grid">';
                catFavs.forEach(fav => {
                    html += '<div class="fav-item">';
                    html += '<div class="fav-card" onclick="startFavorite(' + fav.id + ')">';
                    html += '<div class="fav-icon">' + fav.icon + '</div>';
                    html += '<div class="fav-name">' + fav.name + '</div>';
                    html += '<div class="fav-time">' + formatTimeShort(fav.seconds) + '</div>';
                    html += '</div>';
                    html += '<div class="fav-actions">';
                    html += '<button class="btn-orange btn-small" onclick="editFavorite(' + fav.id + ')">✏️</button>';
                    html += '<button class="btn-stop btn-small" onclick="deleteFavorite(' + fav.id + ')">🗑️</button>';
                    html += '</div></div>';
                });
                html += '</div></div>';
            });
            
            container.innerHTML = html;
        }
        
        window.startFavorite = function(favId) {
            const fav = favorites.find(f => f.id === favId);
            if (fav) {
                addTimer(fav.name, fav.seconds);
                switchTab('timers');
            }
        }
        
        window.addNewCategory = function() {
            const icon = prompt('Icône de la catégorie (emoji):', '📁');
            if (!icon) return;
            
            const name = prompt('Nom de la catégorie:');
            if (!name) return;
            
            if (favorites.some(f => f.category === name)) {
                alert('Cette catégorie existe déjà');
                return;
            }
            
            alert('Catégorie créée ! Ajoutez maintenant des favoris avec le bouton ➕');
            renderFavorites();
        }
        
        window.addFavToCategory = function(category) {
            const icon = prompt('Icône (emoji):', '⭐');
            if (icon === null) return;
            
            const name = prompt('Nom du favori:');
            if (!name) return;
            
            const mins = parseInt(prompt('Durée (minutes):', '5'));
            if (isNaN(mins)) return;
            
            favorites.push({
                id: nextId++,
                category: category,
                icon: icon,
                name: name,
                seconds: mins * 60
            });
            
            renderFavorites();
        }
        
        window.editFavorite = function(favId) {
            const fav = favorites.find(f => f.id === favId);
            if (!fav) return;
            
            const newIcon = prompt('Icône:', fav.icon);
            if (newIcon === null) return;
            
            const newName = prompt('Nom:', fav.name);
            if (!newName) return;
            
            const newMins = parseInt(prompt('Durée (minutes):', Math.floor(fav.seconds / 60)));
            if (isNaN(newMins)) return;
            
            fav.icon = newIcon;
            fav.name = newName;
            fav.seconds = newMins * 60;
            
            renderFavorites();
        }
        
        window.deleteFavorite = function(favId) {
            const fav = favorites.find(f => f.id === favId);
            if (fav && confirm('Supprimer "' + fav.name + '" ?')) {
                favorites = favorites.filter(f => f.id !== favId);
                renderFavorites();
            }
        }
        
        window.deleteCategory = function(category) {
            const count = favorites.filter(f => f.category === category).length;
            if (confirm('Supprimer "' + category + '" et ses ' + count + ' favori(s) ?')) {
                favorites = favorites.filter(f => f.category !== category);
                renderFavorites();
            }
        }
        
        function formatTimeShort(secs) {
            const m = Math.floor(secs / 60);
            const s = secs % 60;
            if (m > 0 && s > 0) return m + ' min ' + s + 's';
            if (m > 0) return m + ' min';
            return s + 's';
        }
        
        // === MINUTERIES ===
        window.createTimer = function() {
            const name = document.getElementById('timer-name').value || 'Minuterie';
            const h = parseInt(document.getElementById('hours').value) || 0;
            const m = parseInt(document.getElementById('minutes').value) || 0;
            const s = parseInt(document.getElementById('seconds').value) || 0;
            const total = h * 3600 + m * 60 + s;
            
            if (total <= 0) {
                alert('Durée invalide');
                return;
            }
            
            addTimer(name, total);
            switchTab('timers');
            
            document.getElementById('timer-name').value = '';
            document.getElementById('hours').value = '0';
            document.getElementById('minutes').value = '10';
            document.getElementById('seconds').value = '0';
        }
        
        function addTimer(name, totalSec) {
            const timer = {
                id: Date.now(),
                name: name,
                totalSeconds: totalSec,
                remainingSeconds: totalSec,
                isRunning: true,
                isFinished: false,
                interval: null,
                beepInterval: null
            };
            
            activeTimers.push(timer);
            startTimer(timer);
            updateTimersDisplay();
        }
        
        function startTimer(timer) {
            timer.interval = setInterval(() => {
                if (timer.isRunning && timer.remainingSeconds > 0) {
                    timer.remainingSeconds--;
                    updateTimersDisplay();
                    
                    if (timer.remainingSeconds === 0) {
                        timerFinished(timer);
                    }
                }
            }, 1000);
        }
        
        function timerFinished(timer) {
            clearInterval(timer.interval);
            timer.isFinished = true;
            
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                let isHigh = true;
                
                const beep = () => {
                    if (timer.isFinished) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.value = isHigh ? 1400 : 1000;
                        osc.type = 'square';
                        gain.gain.setValueAtTime(0.8, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.3);
                        isHigh = !isHigh;
                    }
                };
                
                beep();
                timer.beepInterval = setInterval(beep, 600);
            } catch (e) {}
            
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification('⏰ ' + timer.name, { body: 'Minuterie terminée !' });
            }
            
            updateTimersDisplay();
        }
        
        function pauseTimer(id) {
            const t = activeTimers.find(x => x.id === id);
            if (t) {
                t.isRunning = false;
                updateTimersDisplay();
            }
        }
        
        function resumeTimer(id) {
            const t = activeTimers.find(x => x.id === id);
            if (t) {
                t.isRunning = true;
                updateTimersDisplay();
            }
        }
        
        function stopTimer(id) {
            const t = activeTimers.find(x => x.id === id);
            if (t) {
                clearInterval(t.interval);
                if (t.beepInterval) {
                    clearInterval(t.beepInterval);
                    t.isFinished = false;
                }
                activeTimers = activeTimers.filter(x => x.id !== id);
                updateTimersDisplay();
            }
        }
        
        function updateTimersDisplay() {
            const container = document.getElementById('active-timers');
            
            if (activeTimers.length === 0) {
                container.innerHTML = '<div class="no-timers">Aucune minuterie active</div>';
                return;
            }
            
            container.innerHTML = activeTimers.map(t => {
                const prog = ((t.totalSeconds - t.remainingSeconds) / t.totalSeconds) * 100;
                const style = t.isFinished ? 'background: #4d2020; border-color: #ff0000;' : '';
                
                return `
                    <div class="timer-card" style="${style}">
                        <div class="timer-header">
                            <div class="timer-name">${t.name} ${t.isFinished ? '⏰ TERMINÉE !' : ''}</div>
                        </div>
                        <div class="timer-time" style="${t.isFinished ? 'color: #ff0000;' : ''}">
                            ${t.isFinished ? '00:00' : formatTime(t.remainingSeconds)}
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${t.isFinished ? 100 : prog}%"></div>
                        </div>
                        <div class="timer-controls">
                            ${!t.isFinished && t.isRunning ? 
                                `<button class="btn-pause" onclick="pauseTimer(${t.id})">⏸️ Pause</button>` :
                                !t.isFinished ? `<button class="btn-resume" onclick="resumeTimer(${t.id})">▶️ Reprendre</button>` : ''
                            }
                            <button class="btn-stop" onclick="stopTimer(${t.id})">${t.isFinished ? '🔕 ARRÊTER' : '⏹️ Arrêter'}</button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function formatTime(sec) {
            const h = Math.floor(sec / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = sec % 60;
            if (h > 0) return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        
        // === CUISSON AU POIDS ===
        window.calculateWeightTime = function() {
            const type = document.getElementById('meat-type').value;
            const weight = parseFloat(document.getElementById('weight').value);
            const level = document.getElementById('cooking-level').value;
            
            const timePerKg = cookingTimes[type][level];
            if (!timePerKg) {
                document.getElementById('weight-result').classList.add('hidden');
                return;
            }
            
            const totalMin = Math.round(weight * timePerKg);
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            
            let str = '';
            if (h > 0) str += h + 'h ';
            str += m + 'min';
            
            document.getElementById('calculated-time').textContent = str;
            document.getElementById('weight-result').classList.remove('hidden');
        }
        
        window.createTimerFromWeight = function() {
            const type = document.getElementById('meat-type');
            const cut = document.getElementById('meat-cut');
            const weight = document.getElementById('weight').value;
            const level = document.getElementById('cooking-level');
            
            const name = cut.options[cut.selectedIndex].text + ' ' + type.options[type.selectedIndex].text + ' ' + weight + 'kg (' + level.options[level.selectedIndex].text + ')';
            const timeText = document.getElementById('calculated-time').textContent;
            
            let totalSec = 0;
            const parts = timeText.split(' ');
            parts.forEach(p => {
                if (p.includes('h')) totalSec += parseInt(p) * 3600;
                else if (p.includes('min')) totalSec += parseInt(p) * 60;
            });
            
            addTimer(name, totalSec);
            switchTab('timers');
        }
        
        // INIT
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }
        
        calculateWeightTime();
