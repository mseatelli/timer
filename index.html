<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ma Cuisine - Alarme Fix</title>
    <style>
        :root { --primary: #e67e22; --bg: #fdfcfb; --card: #ffffff; --text: #2c3e50; --border: #ced4da; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 10px; }
        .tabs { display: flex; background: #eee; padding: 5px; border-radius: 12px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 12px 5px; border: none; background: none; font-weight: bold; font-size: 0.7rem; border-radius: 8px; color: #666; }
        .tab.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card); border-radius: 16px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border); margin-bottom: 15px; position: relative; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-main { background: var(--primary); color: white; }
        .btn-sec { background: #f1f1f1; color: var(--text); }
        select, input, textarea { display: block; width: 100%; padding: 15px; font-size: 16px; border: 2px solid var(--primary); border-radius: 12px; margin-bottom: 15px; }
        .urgent { border: 2px solid #e74c3c !important; background: #fff5f5; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .btn-del-timer { background: #eee; color: #555; border: none; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>

<div style="max-width: 500px; margin: 0 auto;">
    <h2 style="text-align:center; color:var(--primary); margin-bottom:15px;">Ma Cuisine 🍳</h2>

    <nav class="tabs">
        <button class="tab active" onclick="showTab('timers', this)">CUISSONS</button>
        <button class="tab" onclick="showTab('favs', this)">FAVORIS</button>
        <button class="tab" onclick="showTab('add-f', this)">+ AJOUTER</button>
        <button class="tab" onclick="showTab('sets', this)">RÉGLAGES</button>
    </nav>

    <div id="timers" class="tab-content active">
        <div id="list-timers" style="text-align:center; padding:20px; color:#999;">Aucune cuisson...</div>
    </div>

    <div id="favs" class="tab-content">
        <select id="sel-filter" onchange="window.activeFilter = this.value; renderAll();"></select>
        <div id="list-favs" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
    </div>

    <div id="add-f" class="tab-content">
        <div class="card">
            <input type="text" id="f-name" placeholder="Nom">
            <input type="number" id="f-time" placeholder="Minutes">
            <select id="f-cat"></select>
            <button class="btn btn-main" onclick="saveFav()">ENREGISTRER</button>
        </div>
    </div>

    <div id="sets" class="tab-content">
        <div class="card">
            <input type="text" id="new-cat-name" placeholder="Nouvelle catégorie">
            <button class="btn btn-main" onclick="addCat()">AJOUTER</button>
        </div>
        <div id="manage-cats" class="card"></div>
        <div class="card">
            <button class="btn btn-sec" onclick="exportData()">📤 EXPORTER</button>
            <textarea id="import-text" style="height:60px; font-size:10px;" placeholder="Collez le JSON ici..."></textarea>
            <button class="btn btn-main" style="background:#27ae60;" onclick="importFromText()">📥 IMPORTER</button>
        </div>
    </div>
</div>

<script>
    const DEFS = ['Tout', 'Riz', 'Pâtes', 'Viandes', 'Légumes', 'Oeufs'];
    window.activeFilter = 'Tout';
    window.activeTimers = [];

    // --- AUDIO ---
    function playBeep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } catch(e) { console.log("Audio bloqué"); }
    }

    // --- LOGIQUE TIMER ---
    function startTimer(name, secs) {
        window.activeTimers.push({ id: Date.now(), name, rem: secs, finished: false });
        showTab('timers');
    }

    function removeTimer(id) {
        window.activeTimers = window.activeTimers.filter(t => t.id !== id);
        updateTimersUI();
    }

    setInterval(() => {
        window.activeTimers.forEach(t => {
            if (t.rem > 0) {
                t.rem--;
            } else if (!t.finished) {
                t.finished = true;
                playBeep();
            }
        });
        if (window.activeTimers.some(t => t.finished)) playBeep();
        updateTimersUI();
    }, 1000);

    function updateTimersUI() {
        const container = document.getElementById('list-timers');
        if (window.activeTimers.length === 0) {
            container.innerHTML = "Aucune cuisson...";
            return;
        }
        container.innerHTML = window.activeTimers.map(t => `
            <div class="card ${t.finished ? 'urgent' : ''}">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>${t.name}</strong>
                    <button class="btn-del-timer" onclick="removeTimer(${t.id})">ANNULER / X</button>
                </div>
                <div style="font-size:2rem; font-weight:bold; color:var(--primary); margin:10px 0;">
                    ${Math.floor(t.rem/60)}:${(t.rem%60).toString().padStart(2,'0')}
                </div>
                ${t.finished ? '<div style="color:red; font-weight:bold;">C\'EST PRÊT !</div>' : ''}
            </div>
        `).join('');
    }

    // --- CORE ---
    function renderAll() {
        const cats = JSON.parse(localStorage.getItem('cats')) || DEFS;
        const favs = JSON.parse(localStorage.getItem('favs')) || [];
        
        document.getElementById('sel-filter').innerHTML = cats.map(c => `<option value="${c}" ${window.activeFilter === c ? 'selected' : ''}>${c}</option>`).join('');
        document.getElementById('f-cat').innerHTML = cats.filter(c => c !== 'Tout').map(c => `<option value="${c}">${c}</option>`).join('');
        document.getElementById('manage-cats').innerHTML = "<h4>Catégories :</h4>" + cats.filter(c => c !== 'Tout').map(c => `
            <div style="display:flex; justify-content:space-between; padding:5px 0;">
                <span>${c}</span><button onclick="delCat('${c}')" style="color:red; border:none; background:none;">✕</button>
            </div>`).join('');

        const filtered = window.activeFilter === 'Tout' ? favs : favs.filter(f => f.cat === window.activeFilter);
        document.getElementById('list-favs').innerHTML = filtered.map(f => `
            <div class="card" onclick="startTimer('${f.name}', ${f.time})" style="text-align:center;">
                <strong>${f.name}</strong><br><span>${Math.floor(f.time/60)} min</span>
                <div onclick="event.stopPropagation(); delFav(${f.id})" style="color:red; font-size:0.6rem; margin-top:5px;">Effacer</div>
            </div>`).join('');
    }

    function saveFav() {
        const name = document.getElementById('f-name').value || "Sans nom";
        const time = (parseInt(document.getElementById('f-time').value) || 1) * 60;
        const cat = document.getElementById('f-cat').value;
        let favs = JSON.parse(localStorage.getItem('favs')) || [];
        favs.push({ id: Date.now(), name, time, cat });
        localStorage.setItem('favs', JSON.stringify(favs));
        showTab('favs');
    }

    function delFav(id) {
        let favs = (JSON.parse(localStorage.getItem('favs')) || []).filter(f => f.id !== id);
        localStorage.setItem('favs', JSON.stringify(favs));
        renderAll();
    }

    function addCat() {
        const val = document.getElementById('new-cat-name').value.trim();
        if (!val) return;
        let cats = JSON.parse(localStorage.getItem('cats')) || DEFS;
        if (!cats.includes(val)) { cats.push(val); localStorage.setItem('cats', JSON.stringify(cats)); }
        document.getElementById('new-cat-name').value = '';
        renderAll();
    }

    function delCat(name) {
        let cats = (JSON.parse(localStorage.getItem('cats')) || DEFS).filter(c => c !== name);
        localStorage.setItem('cats', JSON.stringify(cats));
        renderAll();
    }

    function showTab(id, btn) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (btn) { document.querySelectorAll('.tab').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        renderAll();
    }

    function exportData() {
        const data = { cats: JSON.parse(localStorage.getItem('cats')) || DEFS, favs: JSON.parse(localStorage.getItem('favs')) || [] };
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
        a.download = 'sauvegarde.json'; a.click();
    }

    function importFromText() {
        try {
            const d = JSON.parse(document.getElementById('import-text').value);
            if (d.cats) localStorage.setItem('cats', JSON.stringify(d.cats));
            if (d.favs) localStorage.setItem('favs', JSON.stringify(d.favs));
            location.reload();
        } catch(e) { alert("Erreur format"); }
    }

    window.onload = renderAll;
</script>
</body>
</html>
